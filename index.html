<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affichage TV</title>
<style>
  :root {
    --bg: #0e1420;
    --card: rgba(24,33,51,.82);
    --text: #f2f5fa;
    --muted: #8fa0ba;
    --accent: #5cc8ff;
    --warm: #ffb454;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: #0e1420; --card: rgba(24,33,51,.82); --text: #f2f5fa; --muted: #8fa0ba; --accent: #5cc8ff; --warm: #ffb454;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg) url("fond.jpg") center / cover no-repeat fixed; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .grid {
    box-sizing: border-box; height: 100%; padding: 2.2vh 2vw;
    display: grid; gap: 2vh 1.4vw;
    grid-template-columns: 1.35fr 1fr;
    grid-template-rows: 1.25fr auto 1fr;
    grid-template-areas: "time fetes" "rhum rhum" "libre meteo";
  }
  .card { background: var(--card); border-radius: 2vh; padding: 2.4vh 2.2vw; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .label { font-size: 1.9vh; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.4vh; }
  .time { grid-area: time; justify-content: center; }
  .clock { font-size: 23vh; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 7vh; color: var(--accent); margin-left: .6vw; font-weight: 500; }
  .date { font-size: 5vh; margin-top: 2vh; text-transform: capitalize; }
  .week { font-size: 2.6vh; color: var(--muted); margin-top: .8vh; }
  .fetes { grid-area: fetes; }
  .today-fete { font-size: 3.6vh; font-weight: 600; color: var(--warm); margin-bottom: 1.6vh; }
  .row { display: flex; justify-content: space-between; gap: 1vw; font-size: 2.8vh; padding: 1vh 0; border-top: 1px solid rgba(143,160,186,.22); }
  .row:first-of-type { border-top: 0; }
  .row .when { color: var(--muted); white-space: nowrap; }
  .tag { font-size: 1.8vh; color: var(--accent); margin-left: .6vw; }
  .saint { font-size: 3vh; margin-bottom: 1.4vh; }
  .saint b { color: var(--accent); font-weight: 600; }
  .saint span { color: var(--muted); font-size: 2.4vh; margin-left: 1vw; }
  .big { background: rgba(92,200,255,.10); border-left: .7vh solid var(--accent); border-radius: 1.2vh; padding: .9vh 1.2vw; margin-bottom: 1vh; }
  .big .bn { font-size: 3.6vh; font-weight: 700; }
  .big .bm { font-size: 2.1vh; color: var(--muted); margin-top: .3vh; }
  .wnow { font-size: 7vh; font-weight: 700; line-height: 1.05; }
  .wsub { font-size: 2.4vh; color: var(--muted); margin: .6vh 0 1vh; }
  .rhum { grid-area: rhum; padding: 1.4vh 2vw; gap: 1vh; background: #123a63; color: #ffffff; border-left: .8vh solid #f7e86a; }
  .rrow { display: flex; align-items: center; gap: 1.6vw; }
  .rk { background: #f7e86a; color: #111; border-radius: 1.6vh; padding: .6vh 1.2vw; text-align: center; line-height: 1.05; flex: 0 0 auto; }
  .rk-n { font-size: 5.4vh; font-weight: 800; font-style: italic; }
  .rk-c { font-size: 1.5vh; font-weight: 700; text-transform: uppercase; }
  .rn { flex: 1.8; min-width: 0; }
  .rn-l { font-size: 1.8vh; letter-spacing: .12em; text-transform: uppercase; color: #bcd6f2; }
  .rn-n { font-size: 3.8vh; font-weight: 800; font-style: italic; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { background: rgba(255,255,255,.12); border-radius: 1.4vh; padding: .7vh 1vw; flex: 1; min-width: 0; }
  .st b { display: block; font-size: 3.7vh; font-style: italic; font-weight: 800; line-height: 1.15; }
  .st span { display: block; font-size: 1.8vh; color: #c9dcf3; line-height: 1.2; }
  .prog { display: flex; align-items: center; gap: 1vw; font-size: 1.8vh; color: #c9dcf3; text-transform: uppercase; letter-spacing: .08em; }
  .track { flex: 1; height: .9vh; background: rgba(255,255,255,.25); border-radius: 1vh; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #f7e86a; border-radius: 1vh; }
  .libre { grid-area: libre; background: #6b0f2a; box-shadow: inset 0 0 0 .4vh rgba(255,255,255,.18); }
  .libre .label { color: rgba(255,255,255,.75); }
  .libre-body { flex: 1; display: flex; align-items: center; gap: 2vw; min-height: 0; }
  .libre-body .editable { color: #ffffff; font-weight: 600; align-self: stretch; font-size: 3.2vh; line-height: 1.3; }
  .sign { flex: 0 0 auto; height: 16vh; width: auto; }
  .meteo { grid-area: meteo; }
  .editable { flex: 1; font-size: 3.4vh; line-height: 1.35; outline: none; white-space: pre-wrap; overflow: auto; }
  .editable:empty::before { content: attr(data-ph); color: var(--muted); }
  .editable:focus { outline: 2px dashed var(--accent); outline-offset: .6vh; }
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .grid { height: auto; grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "time" "fetes" "rhum" "libre" "meteo"; }
    .clock { font-size: 18vw; } .clock small { font-size: 6vw; } .date { font-size: 6vw; }
    .label { font-size: 3vw; } .row { font-size: 4.2vw; } .editable { font-size: 5vw; min-height: 20vh; }
    .today-fete { font-size: 5vw; } .rrow { flex-wrap: wrap; } .sign { height: 14vw; } .week { font-size: 3.6vw; }
  }
</style>
</head>
<body>
<div class="grid">
  <section class="card time">
    <div class="clock"><span id="hm">--:--</span></div>
    <div class="date" id="date"></div>
    <div class="week" id="week"></div>
  </section>

  <section class="card fetes">
    <div class="label">Fêtes et jours fériés</div>
    <div class="saint" id="saint"></div>
    <div class="today-fete" id="todayFete"></div>
    <div id="upcoming"></div>
  </section>

  <section class="card libre">
    <div class="label">Information</div>
    <div class="libre-body">
      <div class="editable" id="libre" contenteditable="true" spellcheck="false" data-ph="Cliquer pour écrire un message, une consigne, un menu…"></div>
    </div>
  </section>

  <section class="card meteo">
    <div class="label">Météo · Dinan</div>
    <div class="wnow" id="wnow">Chargement…</div>
    <div class="wsub" id="wsub"></div>
    <div id="wdays"></div>
  </section>

  <section class="card rhum">
    <div class="rrow">
      <div class="rk"><div class="rk-n" id="rkN">–</div><div class="rk-c" id="rkC"></div></div>
      <div class="rn"><div class="rn-l" id="rnL">⛵ Route du Rhum</div><div class="rn-n" id="rnN"></div></div>
      <div class="st"><b id="s1"></b><span id="s1l"></span></div>
      <div class="st"><b id="s2"></b><span id="s2l"></span></div>
      <div class="st"><b id="s3"></b><span id="s3l"></span></div>
    </div>
    <div class="prog"><span>Saint-Malo</span><div class="track"><div class="fill" id="fill"></div></div><span id="routeTxt"></span><span>Pointe-à-Pitre</span></div>
  </section>
</div>

<script>
(function () {
  var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function sod(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function key(d) { return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

  function easter(y) {
    var a = y % 19, b = Math.floor(y / 100), c = y % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  function nthSunday(y, month, n) {
    var d = new Date(y, month, 1);
    while (d.getDay() !== 0) d = addDays(d, 1);
    return addDays(d, 7 * (n - 1));
  }
  function lastSunday(y, month) {
    var d = new Date(y, month + 1, 0);
    while (d.getDay() !== 0) d = addDays(d, -1);
    return d;
  }

  function events(y) {
    var p = easter(y), list = [];
    function f(d, n) { list.push({ d: d, n: n, ferie: true }); }
    function s(d, n) { list.push({ d: d, n: n, ferie: false }); }
    f(new Date(y, 0, 1), "Jour de l’An");
    f(addDays(p, 1), "Lundi de Pâques");
    f(new Date(y, 4, 1), "Fête du Travail");
    f(new Date(y, 4, 8), "Victoire 1945");
    f(addDays(p, 39), "Ascension");
    f(addDays(p, 50), "Lundi de Pentecôte");
    f(new Date(y, 6, 14), "Fête nationale");
    f(new Date(y, 7, 15), "Assomption");
    f(new Date(y, 10, 1), "Toussaint");
    f(new Date(y, 10, 11), "Armistice 1918");
    f(new Date(y, 11, 25), "Noël");
    s(new Date(y, 1, 2), "Chandeleur");
    s(new Date(y, 1, 14), "Saint-Valentin");
    s(addDays(p, -47), "Mardi gras");
    s(p, "Pâques");
    s(new Date(y, 3, 1), "Poisson d’avril");
    s(lastSunday(y, 2), "Passage à l’heure d’été");
    var pent = addDays(p, 49), mere = lastSunday(y, 4);
    if (key(mere) === key(pent)) mere = nthSunday(y, 5, 1);
    s(mere, "Fête des mères");
    s(nthSunday(y, 5, 3), "Fête des pères");
    s(new Date(y, 5, 21), "Fête de la musique");
    s(lastSunday(y, 9), "Passage à l’heure d’hiver");
    s(new Date(y, 9, 31), "Halloween");
    s(new Date(y, 11, 6), "Saint-Nicolas");
    s(new Date(y, 11, 24), "Réveillon de Noël");
    s(new Date(y, 11, 31), "Saint-Sylvestre");
    return list;
  }

  function weekNumber(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }

  var SAINTS = [
    "Basile|Basile|Geneviève|Odilon|Édouard|Mélaine|Raymond|Lucien|Alix|Guillaume|Paulin|Tatiana|Yvette|Nina|Rémi|Marcel|Roseline|Prisca|Marius|Sébastien|Agnès|Vincent|Barnard|François de Sales|Paul|Paule|Angèle|Thomas d’Aquin|Gildas|Martine|Marcelle",
    "Ella|Théophane|Blaise|Véronique|Agathe|Gaston|Eugénie|Jacqueline|Apolline|Arnaud|Notre-Dame de Lourdes|Félix|Béatrice|Valentin|Claude|Julienne|Alexis|Bernadette|Gabin|Aimée|Pierre Damien|Isabelle|Lazare|Modeste|Roméo|Nestor|Honorine|Romain|Auguste",
    "Aubin|Charles le Bon|Guénolé|Casimir|Olive|Colette|Félicité|Jean de Dieu|Françoise|Vivien|Rosine|Justine|Rodrigue|Mathilde|Louise|Bénédicte|Patrick|Cyrille|Joseph|Herbert|Clémence|Léa|Victorien|Karine|Humbert|Larissa|Habib|Gontran|Gwladys|Amédée|Benjamin",
    "Hugues|Sandrine|Richard|Isidore|Irène|Marcellin|Jean-Baptiste de la Salle|Julie|Gautier|Fulbert|Stanislas|Jules|Ida|Maxime|Paterne|Benoît-Joseph|Anicet|Parfait|Emma|Odette|Anselme|Alexandre|Georges|Fidèle|Marc|Alida|Zita|Valérie|Catherine de Sienne|Robert",
    "Joseph|Boris|Philippe et Jacques|Sylvain|Judith|Prudence|Gisèle|Désiré|Pacôme|Solange|Estelle|Achille|Rolande|Matthias|Denise|Honoré|Pascal|Éric|Yves|Bernardin|Constantin|Émile|Didier|Donatien|Sophie|Bérenger|Augustin|Germain|Aymar|Ferdinand|Perrine",
    "Justin|Blandine|Kévin|Clotilde|Igor|Norbert|Gilbert|Médard|Diane|Landry|Barnabé|Guy|Antoine de Padoue|Élisée|Germaine|Jean-François Régis|Hervé|Léonce|Romuald|Silvère|Rodolphe|Alban|Audrey|Jean-Baptiste|Prosper|Anthelme|Fernand|Irénée|Pierre et Paul|Martial",
    "Thierry|Martinien|Thomas|Florent|Antoine|Mariette|Raoul|Thibaut|Amandine|Ulrich|Benoît|Olivier|Henri et Joël|Camille|Donald|Notre-Dame du Mont-Carmel|Charlotte|Frédéric|Arsène|Marina|Victor|Marie-Madeleine|Brigitte|Christine|Jacques|Anne et Joachim|Nathalie|Samson|Marthe|Juliette|Ignace de Loyola",
    "Alphonse|Julien Eymard|Lydie|Jean-Marie Vianney|Abel|Transfiguration|Gaétan|Dominique|Amour|Laurent|Claire|Clarisse|Hippolyte|Evrard|Marie|Armel|Hyacinthe|Hélène|Jean Eudes|Bernard|Christophe|Fabrice|Rose de Lima|Barthélemy|Louis|Natacha|Monique|Augustin|Sabine|Fiacre|Aristide",
    "Gilles|Ingrid|Grégoire|Rosalie|Raïssa|Bertrand|Reine|Adrien|Alain|Inès|Adelphe|Apollinaire|Aimé|Materne|Roland|Édith|Renaud|Nadège|Émilie|Davy|Matthieu|Maurice|Constant|Thècle|Hermann|Côme et Damien|Vincent de Paul|Venceslas|Michel|Jérôme",
    "Thérèse|Léger|Gérard|François d’Assise|Fleur|Bruno|Serge|Pélagie|Denis|Ghislain|Firmin|Wilfried|Géraud|Juste|Thérèse d’Avila|Edwige|Baudouin|Luc|René|Adeline|Céline|Élodie|Jean de Capistran|Florentin|Crépin|Dimitri|Émeline|Simon|Narcisse|Bienvenue|Quentin",
    "Toussaint|Défunts|Hubert|Charles|Sylvie|Bertille|Carine|Geoffroy|Théodore|Léon|Martin|Christian|Brice|Sidoine|Albert|Marguerite|Élisabeth|Aude|Tanguy|Edmond|Rufus|Cécile|Clément|Flora|Catherine|Delphine|Séverin|Jacques de la Marche|Saturnin|André",
    "Florence|Viviane|François-Xavier|Barbara|Gérald|Nicolas|Ambroise|Immaculée Conception|Pierre Fourier|Romaric|Daniel|Jeanne de Chantal|Lucie|Odile|Ninon|Alice|Gaël|Gatien|Urbain|Théophile|Pierre Canisius|Françoise-Xavière|Armand|Adèle|Noël|Étienne|Jean|Innocents|David|Roger|Sylvestre"
  ].map(function (m) { return m.split("|"); });
  function saintOf(d) { return SAINTS[d.getMonth()][d.getDate() - 1] || ""; }
  function renderSaint(now) {
    var el = document.getElementById("saint");
    el.textContent = "";
    var lead = document.createTextNode("Saint du jour : ");
    var b = document.createElement("b"); b.textContent = saintOf(now);
    var sp = document.createElement("span"); sp.textContent = "demain : " + saintOf(addDays(sod(now), 1));
    el.appendChild(lead); el.appendChild(b); el.appendChild(sp);
  }

  function renderFetes(now) {
    var today = sod(now), y = now.getFullYear();
    var all = events(y).concat(events(y + 1));
    all.sort(function (a, b) { return a.d - b.d; });
    var tk = key(today), todayNames = [], up = [];
    all.forEach(function (e) {
      if (key(e.d) === tk) todayNames.push(e.n);
      else if (e.d > today && up.length < 4) up.push(e);
    });
    document.getElementById("todayFete").textContent = todayNames.length ? "Aujourd’hui : " + todayNames.join(" · ") : "";
    renderSaint(now);
    var box = document.getElementById("upcoming");
    box.textContent = "";
    up.forEach(function (e, i) {
      var diff = Math.round((e.d - today) / 86400000);
      if (i < 2) {
        var big = document.createElement("div"); big.className = "big";
        var bn = document.createElement("div"); bn.className = "bn"; bn.textContent = e.n;
        var bm = document.createElement("div"); bm.className = "bm";
        bm.textContent = (diff === 1 ? "demain" : "dans " + diff + " jours") + " · " + JOURS[e.d.getDay()] + " " + e.d.getDate() + " " + MOIS[e.d.getMonth()];
        big.appendChild(bn); big.appendChild(bm); box.appendChild(big);
        return;
      }
      var row = document.createElement("div"); row.className = "row";
      var left = document.createElement("span"); left.textContent = e.n;
      if (e.ferie) { var t = document.createElement("span"); t.className = "tag"; t.textContent = "férié"; left.appendChild(t); }
      var right = document.createElement("span"); right.className = "when";
      var lbl = diff === 1 ? "demain" : "dans " + diff + " j";
      right.textContent = JOURS[e.d.getDay()].slice(0, 3) + ". " + e.d.getDate() + " " + MOIS[e.d.getMonth()].slice(0, 4) + (MOIS[e.d.getMonth()].length > 4 ? "." : "") + " · " + lbl;
      row.appendChild(left); row.appendChild(right); box.appendChild(row);
    });
  }

  var lastDay = "";
  function tick() {
    var now = new Date();
    document.getElementById("hm").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    if (BATEAU) renderRhum(now);
    var dk = key(now);
    if (dk !== lastDay) {
      lastDay = dk;
      document.getElementById("date").textContent = JOURS[now.getDay()] + " " + now.getDate() + " " + MOIS[now.getMonth()] + " " + now.getFullYear();
      document.getElementById("week").textContent = "Semaine " + weekNumber(now);
      renderFetes(now);
      trimFetes();
    }
  }
  tick();
  setInterval(tick, 5000);

  function fitText(el) {
    el.style.fontSize = "";
    var px = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollHeight > el.clientHeight + 1 && px > 12) { px -= 1; el.style.fontSize = px + "px"; }
  }
  // Texte fixe de l’espace libre : écrire entre les guillemets (\n pour un retour à la ligne). Laisser vide pour pouvoir taper au clavier.
  var TEXTE_LIBRE = "⚠️ EPI OBLIGATOIRES ⚠️\n\nSur le chantier, on les porte en permanence 👷\n\n⛑️ Casque\n🥾 Chaussures de sécurité\n🧤 Gants\n🎧 Protections auditives\n🥽 Lunettes de protection";
  ["libre"].forEach(function (id) {
    var el = document.getElementById(id), k = "tv-" + id;
    try { var v = localStorage.getItem(k); if (v) el.textContent = v; } catch (e) {}
    if (TEXTE_LIBRE) { el.textContent = TEXTE_LIBRE; el.contentEditable = "false"; }
    fitText(el);
    window.addEventListener("resize", function () { fitText(el); });
    window.addEventListener("load", function () { fitText(el); });
    el.addEventListener("input", function () { fitText(el); });
    el.addEventListener("input", function () {
      try { localStorage.setItem(k, el.textContent); } catch (e) {}
    });
  });

  var WMO = {0:["Ciel dégagé","☀️"],1:["Plutôt dégagé","🌤️"],2:["Éclaircies","⛅"],3:["Couvert","☁️"],45:["Brouillard","🌫️"],48:["Brouillard givrant","🌫️"],
    51:["Bruine légère","🌦️"],53:["Bruine","🌦️"],55:["Bruine dense","🌦️"],56:["Bruine verglaçante","🌧️"],57:["Bruine verglaçante","🌧️"],
    61:["Pluie faible","🌧️"],63:["Pluie","🌧️"],65:["Pluie forte","🌧️"],66:["Pluie verglaçante","🌧️"],67:["Pluie verglaçante","🌧️"],
    71:["Neige faible","🌨️"],73:["Neige","🌨️"],75:["Neige forte","❄️"],77:["Grains de neige","🌨️"],
    80:["Averses","🌦️"],81:["Averses","🌦️"],82:["Averses violentes","⛈️"],85:["Averses de neige","🌨️"],86:["Averses de neige","🌨️"],
    95:["Orage","⛈️"],96:["Orage et grêle","⛈️"],99:["Orage et grêle","⛈️"]};
  function wmo(c) { return WMO[c] || ["—", ""]; }
  var URL_METEO = "https://api.open-meteo.com/v1/forecast?latitude=48.455&longitude=-2.05" +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=Europe%2FParis&forecast_days=4";
  function loadMeteo() {
    fetch(URL_METEO).then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current, w = wmo(c.weather_code);
      document.getElementById("wnow").textContent = w[1] + " " + Math.round(c.temperature_2m) + "°C";
      document.getElementById("wsub").textContent = w[0] + " · ressenti " + Math.round(c.apparent_temperature) + "° · vent " + Math.round(c.wind_speed_10m) + " km/h";
      var box = document.getElementById("wdays"); box.textContent = "";
      for (var i = 1; i < j.daily.time.length; i++) {
        var d = new Date(j.daily.time[i] + "T12:00:00"), x = wmo(j.daily.weather_code[i]);
        var row = document.createElement("div"); row.className = "row";
        var l = document.createElement("span"); l.textContent = JOURS[d.getDay()].slice(0, 3) + ". " + d.getDate() + "  " + x[1] + " " + x[0];
        var r = document.createElement("span"); r.className = "when";
        r.textContent = Math.round(j.daily.temperature_2m_min[i]) + "° / " + Math.round(j.daily.temperature_2m_max[i]) + "° · 💧" + j.daily.precipitation_probability_max[i] + "%";
        row.appendChild(l); row.appendChild(r); box.appendChild(row);
      }
      trimCard(".meteo", "wdays");
    }).catch(function () {
      document.getElementById("wnow").textContent = "Météo indisponible";
      document.getElementById("wsub").textContent = "Vérifier la connexion internet de la télé";
    });
  }
  loadMeteo();
  setInterval(loadMeteo, 15 * 60 * 1000);

  function trimFetes() {
    var card = document.querySelector(".fetes"), rows = document.getElementById("upcoming").querySelectorAll(".row");
    for (var i = rows.length - 1; i >= 0 && card.scrollHeight > card.clientHeight + 1; i--) rows[i].style.display = "none";
  }
  window.addEventListener("load", trimFetes);

  function trimCard(sel, id) {
    var card = document.querySelector(sel), rows = document.getElementById(id).querySelectorAll(".row");
    for (var i = rows.length - 1; i >= 0 && card.scrollHeight > card.clientHeight + 1; i--) rows[i].style.display = "none";
  }

  // Suivi Route du Rhum : lecture automatique du classement officiel (toutes les 30 min).
  // Les valeurs ci-dessous ne servent que de secours si la lecture échoue.
  var ID_SKIPPER = "a7a3f014-e29d-491f-bda7-d32bfbd0ef03";
  var URL_DIRECT = "https://www.routedurhum.com/_functions/classement?lang=fr";
  var URL_RELAIS = "rhum.json";
  // MODE MANUEL : la lecture automatique est désactivée (le site de la course bloque les accès automatiques).
  // Pour mettre à jour : modifier les valeurs ci-dessous (ou les envoyer en capture à Claude).
  var MODE_MANUEL = true;
  var BATEAU = {
    skipper: "Christophe Bachmann", bateau: "Grain de Sable", categorie: "Vintage Mono", classement: "6e",
    milles: "1 817", km: "3 365", noeuds: "7,1", kmh: "13,1",
    ecartTexte: "211,7 milles", ecartLabel: "392 km pour rattraper W. Clerton, 5e",
    route: 49, maj: "10/11 (matin)", pointage: "", live: false
  };
  function titre(t) { return t.trim().toLowerCase().replace(/(^|[\s-])\S/g, function (m) { return m.toUpperCase(); }); }
  function fmt(n, d) { return n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }); }

  function appliquer(j) {
    var cl = null, me = null;
    j.classes.forEach(function (c) { c.lignes.forEach(function (l) { if (l.id === ID_SKIPPER) { cl = c; me = l; } }); });
    if (!me) throw new Error("skipper introuvable");
    function rang(r) { return cl.lignes.filter(function (l) { return l.rang === r; })[0]; }
    var b = BATEAU, KM = 1.852;
    b.skipper = titre(me.prenom) + " " + titre(me.nom);
    b.bateau = me.bateau.trim();
    b.categorie = cl.nom;
    b.classement = me.rang === 1 ? "1er" : me.rang + "e";
    b.milles = fmt(me.dtf, 0); b.km = fmt(me.dtf * KM, 0);
    b.noeuds = fmt(me.vitesse, 1); b.kmh = fmt(me.vitesse * KM, 1);
    var av = rang(me.rang - 1), ar = rang(me.rang + 1);
    if (av) {
      var g = me.dtl - av.dtl;
      b.ecartTexte = fmt(g, 1) + " milles";
      b.ecartLabel = fmt(g * KM, 1) + " km pour rattraper " + av.prenom.trim().charAt(0).toUpperCase() + ". " + titre(av.nom) + ", " + av.rang + "e";
    } else if (ar) {
      var g2 = ar.dtl - me.dtl;
      b.ecartTexte = fmt(g2, 1) + " milles";
      b.ecartLabel = fmt(g2 * KM, 1) + " km d’avance sur " + ar.prenom.trim().charAt(0).toUpperCase() + ". " + titre(ar.nom);
    }
    b.route = Math.round((j.distance - me.dtf) / j.distance * 100);
    var d = new Date(j.maj);
    var hm = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    b.pointage = isNaN(d) ? "" : (d.toDateString() === new Date().toDateString() ? hm : d.toLocaleDateString("fr-FR", { day: "numeric", month: "numeric" }) + " à " + hm);
    b.vieux = !isNaN(d) && (Date.now() - d.getTime() > 4 * 3600 * 1000);
    b.live = true;
    renderRhum(new Date());
  }
  function charger(url) { return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadRhum() {
    if (MODE_MANUEL) { renderRhum(new Date()); return; }
    charger(URL_DIRECT).then(appliquer).catch(function () {
      return charger(URL_RELAIS + "?t=" + Date.now()).then(appliquer);
    }).catch(function () { renderRhum(new Date()); });
  }

  function renderRhum(now) {
    var ms = now - Date.UTC(2026, 10, 1, 12, 2), j = Math.floor(ms / 86400000);
    var b = BATEAU;
    function set(id, t) { document.getElementById(id).textContent = t; }
    set("rkN", b.classement); set("rkC", "en " + b.categorie);
    set("rnL", "⛵ " + b.bateau + " · " + (j < 0 ? "départ dans " + Math.ceil(-ms / 86400000) + " j" : "jour " + (j + 1) + " de course"));
    set("rnN", b.skipper);
    set("s1", b.milles + " milles"); set("s1l", b.km + " km avant l’arrivée");
    set("s2", b.noeuds + " nœuds"); set("s2l", b.kmh + " km/h au dernier pointage");
    set("s3", b.ecartTexte); set("s3l", b.ecartLabel);
    set("routeTxt", b.route + " % de la route" + (MODE_MANUEL ? " · valeurs du " + b.maj : (b.live && b.pointage ? (b.vieux ? " · ⚠ ancien pointage : " : " · pointage de ") + b.pointage : " · valeurs non actualisées")));
    document.getElementById("fill").style.width = b.route + "%";
    var n = document.getElementById("rnN");
    n.style.fontSize = "";
    var px = parseFloat(getComputedStyle(n).fontSize);
    while (n.scrollWidth > n.clientWidth + 1 && px > 12) { px -= 1; n.style.fontSize = px + "px"; }
  }
  loadRhum();
  window.addEventListener("resize", function () { renderRhum(new Date()); });
  setInterval(loadRhum, 30 * 60 * 1000);
})();
</script>
