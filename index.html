<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affichage TV</title>
<style>
  :root {
    --bg: #0e1420;
    --card: rgba(24,33,51,.55);
    --text: #f2f5fa;
    --muted: #8fa0ba;
    --accent: #5cc8ff;
    --warm: #ffb454;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: #0e1420; --card: rgba(24,33,51,.55); --text: #f2f5fa; --muted: #8fa0ba; --accent: #5cc8ff; --warm: #ffb454;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg) url("fond.jpg") center / cover no-repeat fixed; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .grid {
    box-sizing: border-box; height: 100%; padding: 2.2vh 2vw;
    display: grid; gap: 2vh 1.4vw;
    grid-template-columns: 1.35fr 1fr;
    grid-template-rows: 1.25fr auto 1fr;
    grid-template-areas: "time fetes" "rhum rhum" "libre meteo";
  }
  .card { background: var(--card); border-radius: 2vh; padding: 2.4vh 2.2vw; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .label { font-size: 1.9vh; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.4vh; }
  .time { grid-area: time; justify-content: center; }
  .clock { font-size: 23vh; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 7vh; color: var(--accent); margin-left: .6vw; font-weight: 500; }
  .date { font-size: 5vh; margin-top: 2vh; text-transform: capitalize; }
  .week { font-size: 2.6vh; color: var(--muted); margin-top: .8vh; }
  .fetes { grid-area: fetes; }
  .today-fete { font-size: 3.6vh; font-weight: 600; color: var(--warm); margin-bottom: 1.6vh; }
  .row { display: flex; justify-content: space-between; gap: 1vw; font-size: 2.8vh; padding: 1vh 0; border-top: 1px solid rgba(143,160,186,.22); }
  .row:first-of-type { border-top: 0; }
  .row .when { color: var(--muted); white-space: nowrap; }
  .tag { font-size: 1.8vh; color: var(--accent); margin-left: .6vw; }
  .saint { font-size: 3vh; margin-bottom: 1.4vh; }
  .saint b { color: var(--accent); font-weight: 600; }
  .saint span { color: var(--muted); font-size: 2.4vh; margin-left: 1vw; }
  .big { background: rgba(92,200,255,.10); border-left: .7vh solid var(--accent); border-radius: 1.2vh; padding: .9vh 1.2vw; margin-bottom: 1vh; }
  .big .bn { font-size: 3.6vh; font-weight: 700; }
  .big .bm { font-size: 2.1vh; color: var(--muted); margin-top: .3vh; }
  .wnow { font-size: 7vh; font-weight: 700; line-height: 1.05; }
  .wsub { font-size: 2.4vh; color: var(--muted); margin: .6vh 0 1vh; }
  .rhum { grid-area: rhum; padding: 1.4vh 2vw; gap: 1vh; background: rgba(18,58,99,.72); color: #ffffff; border-left: .8vh solid #f7e86a; }
  .rrow { display: flex; align-items: center; gap: 1.6vw; }
  .rk { background: #f7e86a; color: #111; border-radius: 1.6vh; padding: .6vh 1.2vw; text-align: center; line-height: 1.05; flex: 0 0 auto; }
  .rk-n { font-size: 5.4vh; font-weight: 800; font-style: italic; }
  .rk-c { font-size: 1.5vh; font-weight: 700; text-transform: uppercase; }
  .rn { flex: 1.8; min-width: 0; }
  .rn-l { font-size: 1.8vh; letter-spacing: .12em; text-transform: uppercase; color: #bcd6f2; }
  .rn-n { font-size: 3.8vh; font-weight: 800; font-style: italic; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { background: rgba(255,255,255,.12); border-radius: 1.4vh; padding: .7vh 1vw; flex: 1; min-width: 0; }
  .st b { display: block; font-size: 3.7vh; font-style: italic; font-weight: 800; line-height: 1.15; }
  .st span { display: block; font-size: 1.8vh; color: #c9dcf3; line-height: 1.2; }
  .prog { display: flex; align-items: center; gap: 1vw; font-size: 1.8vh; color: #c9dcf3; text-transform: uppercase; letter-spacing: .08em; }
  .track { flex: 1; height: .9vh; background: rgba(255,255,255,.25); border-radius: 1vh; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #f7e86a; border-radius: 1vh; }
  .libre { grid-area: libre; background: rgba(107,15,42,.72); box-shadow: inset 0 0 0 .4vh rgba(255,255,255,.18); }
  .libre .label { color: rgba(255,255,255,.75); }
  .libre-body { flex: 1; display: flex; align-items: center; gap: 2vw; min-height: 0; }
  .libre-body .editable { color: #ffffff; font-weight: 600; align-self: stretch; font-size: 3.2vh; line-height: 1.3; }
  .sign { flex: 0 0 auto; height: 16vh; width: auto; }
  .meteo { grid-area: meteo; }
  .editable { flex: 1; font-size: 3.4vh; line-height: 1.35; outline: none; white-space: pre-wrap; overflow: auto; }
  .editable:empty::before { content: attr(data-ph); color: var(--muted); }
  .editable:focus { outline: 2px dashed var(--accent); outline-offset: .6vh; }
  @media (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .grid { height: auto; grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "time" "fetes" "rhum" "libre" "meteo"; }
    .clock { font-size: 18vw; } .clock small { font-size: 6vw; } .date { font-size: 6vw; }
    .label { font-size: 3vw; } .row { font-size: 4.2vw; } .editable { font-size: 5vw; min-height: 20vh; }
    .today-fete { font-size: 5vw; } .rrow { flex-wrap: wrap; } .sign { height: 14vw; } .week { font-size: 3.6vw; }
  }
  .card { -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  .time { position: relative; }
  .logo { position: absolute; top: 2vh; right: 1.6vw; height: 5.6vh; width: auto; background: #ffffff; border-radius: 1.4vh; padding: .9vh 1vw; box-sizing: content-box; }
</style>
</head>

    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  function nthSunday(y, month, n) {
    var d = new Date(y, month, 1);

  }
  function lastSunday(y, month) {
    var d = new Date(y, month + 1, 0);

  function events(y) {

  function weekNumber(d) {

  function saintOf(d) { return SAINTS[d.getMonth()][d.getDate() - 1] || ""; }
  function renderSaint(now) {
    var el = document.getElementById("saint");
    el.textContent = "";
    var lead = document.createTextNode("Saint du jour : ");
    var b = document.createElement("b"); b.textContent = saintOf(now);
    var sp = document.createElement("span"); sp.textContent = "demain : " + saintOf(addDays(sod(now), 1));
    el.appendChild(lead); el.appendChild(b); el.appendChild(sp);
  }

  function renderFetes(now) {
    var today = sod(now), y = now.getFullYear();
    var all = events(y).concat(events(y + 1));
    all.sort(function (a, b) { return a.d - b.d; });
    var tk = key(today), todayNames = [], up = [];
    all.forEach(function (e) {
      if (key(e.d) === tk) todayNames.push(e.n);
      else if (e.d > today && up.length < 4) up.push(e);
    });
    document.getElementById("todayFete").textContent = todayNames.length ? "Aujourd’hui : " + todayNames.join(" · ") : "";
    renderSaint(now);
    var box = document.getElementById("upcoming");
    box.textContent = "";
    up.forEach(function (e, i) {
      var diff = Math.round((e.d - today) / 86400000);
      if (i < 2) {
        var big = document.createElement("div"); big.className = "big";
        var bn = document.createElement("div"); bn.className = "bn"; bn.textContent = e.n;
        var bm = document.createElement("div"); bm.className = "bm";
        bm.textContent = (diff === 1 ? "demain" : "dans " + diff + " jours") + " · " + JOURS[e.d.getDay()] + " " + e.d.getDate() + " " + MOIS[e.d.getMonth()];
        big.appendChild(bn); big.appendChild(bm); box.appendChild(big);
        return;
      }
      var row = document.createElement("div"); row.className = "row";
      var left = document.createElement("span"); left.textContent = e.n;
      if (e.ferie) { var t = document.createElement("span"); t.className = "tag"; t.textContent = "férié"; left.appendChild(t); }
      var right = document.createElement("span"); right.className = "when";
      var lbl = diff === 1 ? "demain" : "dans " + diff + " j";
      right.textContent = JOURS[e.d.getDay()].slice(0, 3) + ". " + e.d.getDate() + " " + MOIS[e.d.getMonth()].slice(0, 4) + (MOIS[e.d.getMonth()].length > 4 ? "." : "") + " · " + lbl;
      row.appendChild(left); row.appendChild(right); box.appendChild(row);

  var lastDay = "";
  function tick() {
    var now = new Date();
    document.getElementById("hm").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    if (BATEAU) renderRhum(now);
    var dk = key(now);
    if (dk !== lastDay) {
      lastDay = dk;
      document.getElementById("date").textContent = JOURS[now.getDay()] + " " + now.getDate() + " " + MOIS[now.getMonth()] + " " + now.getFullYear();
      document.getElementById("week").textContent = "Semaine " + weekNumber(now);
      renderFetes(now);
      trimFetes();
    }
  }
  tick();
  setInterval(tick, 5000);

  }
  // Texte fixe de l’espace libre : écrire entre les guillemets (\n pour un retour à la ligne). Laisser vide pour pouvoir taper au clavier.

  ["libre"].forEach(function (id) {

  var WMO = {0:["Ciel dégagé","☀️"],1:["Plutôt dégagé","🌤️"],2:["Éclaircies","⛅"],3:["Couvert","☁️"],45:["Brouillard","🌫️"],48:["Brouillard givrant","🌫️"],
    51:["Bruine légère","🌦️"],53:["Bruine","🌦️"],55:["Bruine dense","🌦️"],56:["Bruine verglaçante","🌧️"],57:["Bruine verglaçante","🌧️"],

    95:["Orage","⛈️"],96:["Orage et grêle","⛈️"],99:["Orage et grêle","⛈️"]};
  function wmo(c) { return WMO[c] || ["—", ""]; }
  var URL_METEO = "https://api.open-meteo.com/v1/forecast?latitude=48.455&longitude=-2.05" +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=Europe%2FParis&forecast_days=4";
  function loadMeteo() {
    fetch(URL_METEO).then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current, w = wmo(c.weather_code);
      document.getElementById("wnow").textContent = w[1] + " " + Math.round(c.temperature_2m) + "°C";
      document.getElementById("wsub").textContent = w[0] + " · ressenti " + Math.round(c.apparent_temperature) + "° · vent " + Math.round(c.wind_speed_10m) + " km/h";
      var box = document.getElementById("wdays"); box.textContent = "";
      for (var i = 1; i < j.daily.time.length; i++) {
        var d = new Date(j.daily.time[i] + "T12:00:00"), x = wmo(j.daily.weather_code[i]);
        var row = document.createElement("div"); row.className = "row";

  // Suivi Route du Rhum : lecture automatique du classement officiel (toutes les 30 min).
  // Les valeurs ci-dessous ne servent que de secours si la lecture échoue.
  var ID_SKIPPER = "a7a3f014-e29d-491f-bda7-d32bfbd0ef03";
  var URL_DIRECT = "https://www.routedurhum.com/_functions/classement?lang=fr";
  var URL_RELAIS = "rhum.json";
  // MODE MANUEL : la lecture automatique est désactivée (le site de la course bloque les accès automatiques).
  // Pour mettre à jour : modifier les valeurs ci-dessous (ou les envoyer en capture à Claude).
  var MODE_MANUEL = true;
  var BATEAU = {
    skipper: "Christophe Bachmann", bateau: "Grain de Sable", categorie: "Vintage Mono", classement: "7e",
    milles: "1 616", km: "2 993", noeuds: "7,0", kmh: "13,0",
    ecartTexte: "+566,2 milles", ecartLabel: "1 049 km derrière le premier",
    route: 54, maj: "12/11 à 7 h", pointage: "", live: false
  };
  function titre(t) { return t.trim().toLowerCase().replace(/(^|[\s-])\S/g, function (m) { return m.toUpperCase(); }); }
  function fmt(n, d) { return n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }); }

  function appliquer(j) {
    var cl = null, me = null;
    j.classes.forEach(function (c) { c.lignes.forEach(function (l) { if (l.id === ID_SKIPPER) { cl = c; me = l; } }); });
    if (!me) throw new Error("skipper introuvable");
    function rang(r) { return cl.lignes.filter(function (l) { return l.rang === r; })[0]; }
    var b = BATEAU, KM = 1.852;
    b.skipper = titre(me.prenom) + " " + titre(me.nom);
    b.bateau = me.bateau.trim();
    b.categorie = cl.nom;
    b.classement = me.rang === 1 ? "1er" : me.rang + "e";
    b.milles = fmt(me.dtf, 0); b.km = fmt(me.dtf * KM, 0);
    b.noeuds = fmt(me.vitesse, 1); b.kmh = fmt(me.vitesse * KM, 1);
    var av = rang(me.rang - 1), ar = rang(me.rang + 1);
    if (av) {
      var g = me.dtl - av.dtl;
      b.ecartTexte = fmt(g, 1) + " milles";
      b.ecartLabel = fmt(g * KM, 1) + " km pour rattraper " + av.prenom.trim().charAt(0).toUpperCase() + ". " + titre(av.nom) + ", " + av.rang + "e";
    } else if (ar) {
      var g2 = ar.dtl - me.dtl;
      b.ecartTexte = fmt(g2, 1) + " milles";
      b.ecartLabel = fmt(g2 * KM, 1) + " km d’avance sur " + ar.prenom.trim().charAt(0).toUpperCase() + ". " + titre(ar.nom);
    }
    b.route = Math.round((j.distance - me.dtf) / j.distance * 100);
    var d = new Date(j.maj);
    var hm = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    b.pointage = isNaN(d) ? "" : (d.toDateString() === new Date().toDateString() ? hm : d.toLocaleDateString("fr-FR", { day: "numeric", month: "numeric" }) + " à " + hm);
    b.vieux = !isNaN(d) && (Date.now() - d.getTime() > 4 * 3600 * 1000);
    b.live = true;
    renderRhum(new Date());
  }
  function charger(url) { return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadRhum() {
    if (MODE_MANUEL) { renderRhum(new Date()); return; }
    charger(URL_DIRECT).then(appliquer).catch(function () {
      return charger(URL_RELAIS + "?t=" + Date.now()).then(appliquer);
    }).catch(function () { renderRhum(new Date()); });
  }

  function renderRhum(now) {
    var ms = now - Date.UTC(2026, 10, 1, 12, 2), j = Math.floor(ms / 86400000);
    var b = BATEAU;
    function set(id, t) { document.getElementById(id).textContent = t; }
    set("rkN", b.classement); set("rkC", "en " + b.categorie);
    set("rnL", "⛵ " + b.bateau + " · " + (j < 0 ? "départ dans " + Math.ceil(-ms / 86400000) + " j" : "jour " + (j + 1) + " de course"));
    set("rnN", b.skipper);
    set("s1", b.milles + " milles"); set("s1l", b.km + " km avant l’arrivée");
    set("s2", b.noeuds + " nœuds"); set("s2l", b.kmh + " km/h au dernier pointage");
    set("s3", b.ecartTexte); set("s3l", b.ecartLabel);
    set("routeTxt", b.route + " % de la route" + (MODE_MANUEL ? " · valeurs du " + b.maj : (b.live && b.pointage ? (b.vieux ? " · ⚠ ancien pointage : " : " · pointage de ") + b.pointage : " · valeurs non actualisées")));
    document.getElementById("fill").style.width = b.route + "%";
    var n = document.getElementById("rnN");
    n.style.fontSize = "";
    var px = parseFloat(getComputedStyle(n).fontSize);
    while (n.scrollWidth > n.clientWidth + 1 && px > 12) { px -= 1; n.style.fontSize = px + "px"; }
  }
  loadRhum();
  window.addEventListener("resize", function () { renderRhum(new Date()); });
  setInterval(loadRhum, 30 * 60 * 1000);
})();
